name: Build ATLAS NeurIPS artifact

on:
  push:
    branches:
      - tmp-atlas-neurips-build-20260728

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp main.pdf artifact/ATLAS_NeurIPS2026.pdf
          cp main.tex artifact/ATLAS_NeurIPS2026.tex
          if [ -f README.md ]; then cp README.md artifact/README.md; fi
          if [ -f revision_notes_ja.md ]; then cp revision_notes_ja.md artifact/revision_notes_ja.md; fi
          pdfinfo main.pdf > artifact/pdfinfo.txt
          grep -E "Output written|Overfull|Underfull|Warning|undefined" main.log > artifact/compile_audit.txt || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-NeurIPS-build
          path: artifact
          if-no-files-found: error
