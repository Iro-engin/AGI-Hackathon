name: ATLAS-SB ICML replication

on:
  push:
    paths:
      - 'icml_atlas_sb/**'
      - '.github/workflows/atlas-sb-icml.yml'
  pull_request:
    paths:
      - 'icml_atlas_sb/**'
      - '.github/workflows/atlas-sb-icml.yml'
  workflow_dispatch:

concurrency:
  group: atlas-sb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message || '', '[skip atlas]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: icml_atlas_sb/requirements.txt

      - name: Install Python dependencies
        run: pip install -r icml_atlas_sb/requirements.txt

      - name: Run strict multidimensional Monte Carlo
        id: mc
        continue-on-error: true
        working-directory: icml_atlas_sb
        run: |
          rm -rf generated/monte_carlo
          mkdir -p generated
          set -o pipefail
          python run_monte_carlo.py \
            --out generated/monte_carlo \
            --seeds 6 \
            --T 6000 \
            --c-det 2.0 \
            --kappa 0.25 \
            2>&1 | tee generated_monte_carlo.log

      - name: Run public UCI next-batch analysis
        id: uci
        continue-on-error: true
        working-directory: icml_atlas_sb
        run: |
          rm -rf generated/uci
          mkdir -p generated
          set -o pipefail
          python run_uci_fast.py \
            --archive data/gas_sensor_array_drift.zip \
            --out generated/uci \
            --bootstrap 500 \
            --c-det 2.0 \
            --kappa 0.25 \
            2>&1 | tee generated_uci.log

      - name: Audit expert-loss cap
        id: loss_audit
        if: ${{ steps.mc.outcome == 'success' && steps.uci.outcome == 'success' }}
        continue-on-error: true
        working-directory: icml_atlas_sb
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          mc=pd.read_csv('generated/monte_carlo/strict_results.csv')
          fixed=mc[mc.method.str.startswith('Fixed-')]
          pivot=fixed.pivot_table(index=['seed','scenario','dimension','time'],columns='method',values='realized_nll')
          mc_max=float((pivot.max(axis=1)-pivot.min(axis=1)).max())
          uci=pd.read_csv('generated/uci/batch_ahead_results.csv')
          ufixed=uci[uci.method.str.startswith('Fixed-')]
          upivot=ufixed.pivot_table(index='target_batch',columns='method',values='mean_nll')
          uci_max=float((upivot.max(axis=1)-upivot.min(axis=1)).max())
          text=f'monte_carlo_max_expert_loss_range={mc_max}\nuci_max_expert_loss_range={uci_max}\ncap=30.0\n'
          Path('generated/loss_cap_audit.txt').write_text(text)
          print(text)
          if mc_max >= 30.0 or uci_max >= 30.0:
              raise SystemExit('The numerical cap was active; implementation and regret theorem differ.')
          PY

      - name: Generate tables and figures
        id: assets
        if: ${{ steps.mc.outcome == 'success' && steps.uci.outcome == 'success' && steps.loss_audit.outcome == 'success' }}
        continue-on-error: true
        working-directory: icml_atlas_sb
        run: |
          rm -rf paper/generated
          mkdir -p paper/generated
          set -o pipefail
          python make_assets.py \
            --mc generated/monte_carlo \
            --uci generated/uci \
            --out paper/generated \
            2>&1 | tee generated_assets.log
          cp generated/loss_cap_audit.txt paper/generated/

      - name: Compile and preflight ICML paper
        id: compile
        if: ${{ steps.assets.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          curl -L --fail --retry 3 \
            -o /tmp/icml2026.zip \
            https://media.icml.cc/Conferences/ICML2026/Styles/icml2026.zip
          rm -rf /tmp/icml2026
          unzip -qo /tmp/icml2026.zip -d /tmp/icml2026
          STYLE=$(find /tmp/icml2026 -name icml2026.sty -print -quit)
          BST=$(find /tmp/icml2026 -name icml2026.bst -print -quit)
          test -n "$STYLE"
          test -n "$BST"
          cp "$STYLE" icml_atlas_sb/paper/icml2026.sty
          cp "$BST" icml_atlas_sb/paper/icml2026.bst
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-science latexmk poppler-utils qpdf ghostscript zip
          cd icml_atlas_sb/paper
          latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode main.tex \
            2>&1 | tee ../generated_compile.log
          mkdir -p ../release/render
          cp main.pdf ../release/ATLAS_SB_ICML2026.pdf
          cp main.tex proofs.tex proofs_final.tex aggregation_proof.tex references.bib \
            icml2026.sty icml2026.bst ../release/
          cp -r generated ../release/generated
          cp ../README.md ../requirements.txt ../atlas_sb.py ../run_monte_carlo.py \
            ../run_uci.py ../run_uci_fast.py ../make_assets.py ../release/
          cp ../generated/loss_cap_audit.txt ../release/
          grep -E 'MAIN_END_PAGE|APPENDIX_START_PAGE|Output written|Overfull|Underfull|undefined|LaTeX Warning' main.log \
            > ../release/compile_audit.txt || true
          pdfinfo main.pdf > ../release/pdfinfo.txt
          pdffonts main.pdf > ../release/pdffonts.txt
          qpdf --check main.pdf > ../release/qpdf_check.txt 2>&1
          pdftoppm -png -r 110 main.pdf ../release/render/page >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          pages=sorted(Path('../release/render').glob('page-*.png'))
          thumbs=[]
          for path in pages:
              image=Image.open(path).convert('RGB')
              image.thumbnail((420,560))
              canvas=Image.new('RGB',(440,600),'white')
              canvas.paste(image,((440-image.width)//2,20))
              ImageDraw.Draw(canvas).text((10,575),path.stem,fill='black')
              thumbs.append(canvas)
          cols=3
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*440,rows*600),'white')
          for i,image in enumerate(thumbs):
              sheet.paste(image,((i%cols)*440,(i//cols)*600))
          sheet.save('../release/contact_sheet.png')
          PY
          MAIN=$(grep -o 'MAIN_END_PAGE=[0-9]*' main.log | tail -1 | cut -d= -f2)
          echo "main_pages=${MAIN}" > ../release/page_limit_audit.txt
          if [ -z "$MAIN" ] || [ "$MAIN" -gt 8 ]; then
            echo 'ICML main-text page limit failed' >> ../release/page_limit_audit.txt
            exit 21
          fi
          if grep -q 'Overfull \\hbox' main.log; then
            echo 'Overfull box detected' >> ../release/page_limit_audit.txt
            exit 22
          fi
          if grep -Eqi 'undefined references|undefined citation' main.log; then
            echo 'Undefined reference or citation detected' >> ../release/page_limit_audit.txt
            exit 23
          fi
          cd ../release
          zip -9 -r ATLAS_SB_ICML2026_source.zip \
            main.tex proofs.tex proofs_final.tex aggregation_proof.tex references.bib \
            icml2026.sty icml2026.bst README.md requirements.txt atlas_sb.py \
            run_monte_carlo.py run_uci.py run_uci_fast.py make_assets.py \
            loss_cap_audit.txt generated
          sha256sum * > SHA256SUMS.txt

      - name: Record pipeline status
        if: always()
        run: |
          mkdir -p icml_atlas_sb/status
          cat > icml_atlas_sb/status/latest.txt <<EOF
          commit=${GITHUB_SHA}
          event=${{ github.event_name }}
          monte_carlo=${{ steps.mc.outcome }}
          uci=${{ steps.uci.outcome }}
          loss_audit=${{ steps.loss_audit.outcome }}
          assets=${{ steps.assets.outcome }}
          compile=${{ steps.compile.outcome }}
          EOF

      - name: Commit generated results, release, and diagnostics
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          git config user.name 'atlas-sb-bot'
          git config user.email 'atlas-sb-bot@users.noreply.github.com'
          git add -f icml_atlas_sb/status
          for path in \
            icml_atlas_sb/generated \
            icml_atlas_sb/paper/generated \
            icml_atlas_sb/release \
            icml_atlas_sb/generated_monte_carlo.log \
            icml_atlas_sb/generated_uci.log \
            icml_atlas_sb/generated_assets.log \
            icml_atlas_sb/generated_compile.log; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m '[skip atlas] Regenerate ATLAS-SB ICML artifacts and diagnostics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-SB-ICML-build
          path: |
            icml_atlas_sb/generated
            icml_atlas_sb/paper/generated
            icml_atlas_sb/release
            icml_atlas_sb/status
            icml_atlas_sb/generated_*.log
          if-no-files-found: error
