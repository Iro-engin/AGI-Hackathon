name: Build ATLAS NeurIPS artifact

on:
  pull_request:
    branches:
      - tmp-atlas-neurips-base-20260728

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch official NeurIPS 2026 style
        run: |
          curl -L --fail --retry 3 -o /tmp/neurips2026.zip https://media.neurips.cc/Conferences/NeurIPS2026/Formatting_Instructions_For_NeurIPS_2026.zip
          rm -rf /tmp/neurips-kit
          mkdir -p /tmp/neurips-kit
          unzip -q /tmp/neurips2026.zip -d /tmp/neurips-kit
          STYLE=$(find /tmp/neurips-kit -name neurips_2026.sty -print -quit)
          test -n "$STYLE"
          cp "$STYLE" ./neurips_2026.sty
      - name: Assemble submission source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('main.tex')
          text = path.read_text(encoding='utf-8')
          needle = r'\section{Relation to prior work}'
          if needle not in text:
              raise SystemExit('insertion point not found')
          text = text.replace(needle, r'\input{main_additions}' + '\n\n' + needle, 1)
          old_end = r'\typeout{MAIN_END_PAGE=\thepage}' + '\n' + r'\clearpage'
          new_end = r'\clearpage' + '\n' + r'\typeout{MAIN_END_PAGE=\number\numexpr\value{page}-1\relax}'
          if old_end not in text:
              raise SystemExit('main-page audit marker not found')
          text = text.replace(old_end, new_end, 1)
          old_appendix = r'\bibliography{references}' + '\n\n' + r'\appendix'
          new_appendix = r'\bibliography{references}' + '\n\n' + r'\clearpage' + '\n' + r'\appendix'
          if old_appendix not in text:
              raise SystemExit('appendix insertion point not found')
          text = text.replace(old_appendix, new_appendix, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Audit and stage release
        run: |
          rm -rf release
          mkdir -p release
          cp main.pdf release/ATLAS_NeurIPS2026.pdf
          cp main.tex main_additions.tex proofs.tex checklist.tex references.bib neurips_2026.sty release/
          cp README.md revision_notes_ja.md release/
          grep -E "MAIN_END_PAGE|APPENDIX_START_PAGE|CHECKLIST_START_PAGE|Output written|Overfull|Underfull|LaTeX Warning|undefined" main.log > release/compile_audit.txt || true
          grep -E "MAIN_END_PAGE|APPENDIX_START_PAGE|CHECKLIST_START_PAGE|Output written" main.log > release/page_audit.txt || true
          wc -c main.pdf > release/pdf_size.txt
          (cd release && zip -9 ATLAS_NeurIPS2026_source.zip main.tex main_additions.tex proofs.tex checklist.tex references.bib neurips_2026.sty README.md revision_notes_ja.md)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-NeurIPS-build
          path: release
          if-no-files-found: error

  audit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ATLAS-NeurIPS-build
          path: release
      - name: Print page and warning audit
        run: |
          echo '=== PAGE AUDIT ==='
          cat release/page_audit.txt
          echo '=== COMPILE AUDIT ==='
          cat release/compile_audit.txt
